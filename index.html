<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voices Together</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Cinematic Blur & Scale Page Transitions */
    .cinematic-enter {
      animation: cinematicIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cinematicIn {
      0% {
        opacity: 0;
        filter: blur(16px) brightness(1.2);
        transform: scale(1.08);
      }
      100% {
        opacity: 1;
        filter: blur(0px) brightness(1);
        transform: scale(1);
      }
    }

    /* Iris Wipe Glow Overlay during Transition */
    .transition-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(236, 72, 153, 0) 70%);
      animation: irisWipe 0.75s ease-out forwards;
    }

    @keyframes irisWipe {
      0% {
        opacity: 1;
        transform: scale(0.4);
      }
      50% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: scale(2.5);
      }
    }
  </style>
</head>
<body class="bg-stone-900 text-slate-800 transition-colors duration-500">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false);

      const handleNavigate = (page) => {
        setIsTransitioning(true);
        setTimeout(() => {
          setCurrentPage(page);
          setTimeout(() => setIsTransitioning(false), 50);
        }, 350);
      };

      const toggleTheme = () => {
        setIsDarkMode(!isDarkMode);
      };

      return (
        <div className={`min-h-screen transition-colors duration-500 flex flex-col items-center justify-center p-4 sm:p-8 ${
          isDarkMode ? 'bg-[#0f0e17] text-white' : 'bg-[#f7f5f0] text-slate-900'
        }`}>
          {/* Top Bar with Theme Toggle */}
          <div className="w-full max-w-5xl flex justify-between items-center mb-6">
            <div className="flex items-center gap-2">
              <div className="w-3 h-3 rounded-full bg-pink-500 animate-pulse"></div>
              <span className="text-xs uppercase tracking-widest font-bold opacity-60">
                Interactive Music Experience
              </span>
            </div>
            
            <button
              onClick={toggleTheme}
              className={`px-4 py-2 rounded-full flex items-center gap-2 text-sm font-semibold transition-all shadow-sm hover:scale-105 active:scale-95 ${
                isDarkMode 
                  ? 'bg-slate-800 text-yellow-300 hover:bg-slate-700 border border-slate-700' 
                  : 'bg-white text-slate-800 hover:bg-slate-100 border border-slate-200'
              }`}
            >
              {isDarkMode ? '☀️ Light Mode' : '🌙 Dark Mode'}
            </button>
          </div>

          {/* Main Content Container with Screen Box Styling */}
          <div className={`relative w-full max-w-5xl min-h-[580px] rounded-3xl overflow-hidden transition-all duration-500 shadow-2xl border ${
            isDarkMode 
              ? 'bg-[#161522] border-slate-800/80' 
              : 'bg-[#faf8f5] border-slate-200/80'
          }`}>
            
            {/* Cinematic Lens Flare Effect */}
            {isTransitioning && <div className="transition-overlay" />}

            {/* Render Current Slide Page */}
            <div className={`w-full h-full p-8 md:p-14 ${!isTransitioning ? 'cinematic-enter' : 'opacity-0'}`}>
              {currentPage === 'home' && <HomePage onNavigate={handleNavigate} isDarkMode={isDarkMode} />}
              {currentPage === 'page2' && <Page2 onNavigate={handleNavigate} isDarkMode={isDarkMode} />}
              {currentPage === 'page3' && <Page3 onNavigate={handleNavigate} isDarkMode={isDarkMode} />}
              {currentPage === 'page4' && <Page4 onNavigate={handleNavigate} isDarkMode={isDarkMode} />}
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- PAGE 1: HOME PAGE ---------------- */
    function HomePage({ onNavigate, isDarkMode }) {
      return (
        <div className="relative min-h-[500px] flex flex-col md:flex-row justify-between items-center gap-10">
          {/* Abstract background 3D shape */}
          <div className="absolute -top-10 -left-10 w-48 h-48 rounded-full bg-gradient-to-tr from-purple-500/20 to-pink-500/20 blur-3xl pointer-events-none" />
          
          {/* Left Hero Section */}
          <div className="flex-1 space-y-4 z-10">
            <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg mb-6">
              <i data-lucide="music" class="w-8 h-8"></i>
            </div>
            <h1 className="text-5xl md:text-6xl font-extrabold tracking-tight leading-tight">
              Voices <br />
              <span className="bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">
                Together
              </span>
            </h1>
            <p className={`text-lg font-medium ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
              No Barriers
            </p>
          </div>

          {/* Right Interactive Buttons */}
          <div className="flex-1 w-full max-w-md space-y-4 z-10">
            <button
              onClick={() => onNavigate('page2')}
              className={`w-full p-5 rounded-2xl flex items-center gap-4 text-left transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl group ${
                isDarkMode 
                  ? 'bg-purple-900/30 border border-purple-800/50 hover:bg-purple-900/50 text-purple-100' 
                  : 'bg-[#d8c3e5] hover:bg-[#ceb5de] text-slate-900'
              }`}
            >
              <div className="w-10 h-10 rounded-full bg-black flex items-center justify-center text-white shrink-0 group-hover:scale-110 transition-transform">
                <i data-lucide="search" class="w-5 h-5"></i>
              </div>
              <span className="font-bold text-sm leading-snug">
                Choruses that everyone can sing without thinking twice.
              </span>
            </button>

            <button
              onClick={() => onNavigate('page3')}
              className={`w-full p-5 rounded-2xl flex items-center gap-4 text-left transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl group ${
                isDarkMode 
                  ? 'bg-pink-900/30 border border-pink-800/50 hover:bg-pink-900/50 text-pink-100' 
                  : 'bg-[#ff79f2] hover:bg-[#f65ce7] text-slate-900'
              }`}
            >
              <div className="w-10 h-10 rounded-full bg-black flex items-center justify-center text-white shrink-0 group-hover:scale-110 transition-transform">
                <i data-lucide="search" class="w-5 h-5"></i>
              </div>
              <span className="font-bold text-sm leading-snug">
                Lyrics remembered by heart across different ages.
              </span>
            </button>

            <button
              onClick={() => onNavigate('page4')}
              className={`w-full p-5 rounded-2xl flex items-center gap-4 text-left transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl group ${
                isDarkMode 
                  ? 'bg-purple-950/40 border border-purple-800/40 hover:bg-purple-900/40 text-purple-200' 
                  : 'bg-[#cbb2d6] hover:bg-[#c0a4cc] text-slate-900'
              }`}
            >
              <div className="w-10 h-10 rounded-full bg-black flex items-center justify-center text-white shrink-0 group-hover:scale-110 transition-transform">
                <i data-lucide="search" class="w-5 h-5"></i>
              </div>
              <span className="font-bold text-sm leading-snug">
                Songs that instantly bring smiles and laughter.
              </span>
            </button>
          </div>
        </div>
      );
    }

    /* ---------------- PAGE 2: ONE CROWD ---------------- */
    function Page2({ onNavigate, isDarkMode }) {
      return (
        <div className="space-y-8">
          <div className="flex justify-between items-start">
            <h2 className="text-4xl md:text-5xl font-extrabold tracking-tight">
              One Crowd
            </h2>
            <BackButton onNavigate={onNavigate} isDarkMode={isDarkMode} />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            {/* Image Card */}
            <div className="rounded-3xl overflow-hidden shadow-xl border border-slate-200/20">
              <img 
                src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80" 
                alt="Girl listening to music on headphones"
                className="w-full h-64 object-cover hover:scale-105 transition-transform duration-500"
              />
            </div>

            {/* Feature Box */}
            <div className={`p-8 rounded-3xl border space-y-3 ${
              isDarkMode 
                ? 'bg-pink-900/20 border-pink-700/40 text-pink-100' 
                : 'bg-[#ff7cf4] text-slate-900 border-transparent'
            }`}>
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-black flex items-center justify-center text-white">
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </div>
                <h3 className="font-extrabold text-xl">One Emotion</h3>
              </div>
              <p className="text-sm font-medium leading-relaxed opacity-90 pl-11">
                Concerts turn strangers into a unified crowd. For a moment, everyone shares the same rhythm and excitement.
              </p>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- PAGE 3: MUSIC FESTIVALS ---------------- */
    function Page3({ onNavigate, isDarkMode }) {
      return (
        <div className="space-y-8">
          <div className="flex justify-between items-start">
            <div>
              <h2 className="text-4xl md:text-5xl font-extrabold tracking-tight">
                Music Festivals
              </h2>
              <p className={`text-sm font-semibold mt-1 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                Collective Joy
              </p>
            </div>
            <BackButton onNavigate={onNavigate} isDarkMode={isDarkMode} />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            {/* Guitar Photo */}
            <div className="rounded-3xl overflow-hidden shadow-xl border border-slate-200/20">
              <img 
                src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80" 
                alt="Person playing acoustic guitar"
                className="w-full h-72 object-cover hover:scale-105 transition-transform duration-500"
              />
            </div>

            {/* 3 Points Container */}
            <div className={`p-8 rounded-3xl border space-y-6 ${
              isDarkMode 
                ? 'bg-purple-900/20 border-purple-700/40 text-purple-100' 
                : 'bg-[#c6a2d9] text-slate-900 border-transparent'
            }`}>
              <div className="flex items-start gap-4">
                <div className="w-8 h-8 rounded-full bg-black flex items-center justify-center text-white shrink-0 mt-1">
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </div>
                <p className="text-sm font-semibold leading-snug">
                  People from different backgrounds sharing one stage and sound.
                </p>
              </div>

              <div className="flex items-start gap-4">
                <div className="w-8 h-8 rounded-full bg-black flex items-center justify-center text-white shrink-0 mt-1">
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </div>
                <p className="text-sm font-semibold leading-snug">
                  Music creating connection beyond language or culture.
                </p>
              </div>

              <div className="flex items-start gap-4">
                <div className="w-8 h-8 rounded-full bg-black flex items-center justify-center text-white shrink-0 mt-1">
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </div>
                <p className="text-sm font-semibold leading-snug">
                  Memories that feel stronger when experienced together.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- PAGE 4: JUST SING ---------------- */
    function Page4({ onNavigate, isDarkMode }) {
      return (
        <div className="space-y-6">
          <div className="flex justify-between items-start">
            <h2 className="text-4xl md:text-5xl font-extrabold tracking-tight">
              Just Sing
            </h2>
            <BackButton onNavigate={onNavigate} isDarkMode={isDarkMode} />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            {/* Left Column - Singer Photo */}
            <div className="rounded-3xl overflow-hidden shadow-xl border border-slate-200/20">
              <img 
                src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80" 
                alt="Woman singing into microphone"
                className="w-full h-72 object-cover hover:scale-105 transition-transform duration-500"
              />
            </div>

            {/* Right Column - Text & Headphone Girl Photo */}
            <div className="space-y-6">
              <div className="space-y-2">
                <h3 className="font-extrabold text-2xl">No Judgement</h3>
                <p className={`text-sm font-medium leading-relaxed ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                  When people sing together, perfection no longer matters. Joy comes from participation, not vocal skill.
                </p>
              </div>

              <div className="rounded-3xl overflow-hidden shadow-xl border border-slate-200/20">
                <img 
                  src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=800&q=80" 
                  alt="Girl enjoying music"
                  className="w-full h-44 object-cover hover:scale-105 transition-transform duration-500"
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- REUSABLE BACK BUTTON ---------------- */
    function BackButton({ onNavigate, isDarkMode }) {
      return (
        <button
          onClick={() => onNavigate('home')}
          className={`px-5 py-2.5 rounded-full flex items-center gap-2 font-bold text-sm transition-all shadow-md hover:scale-105 active:scale-95 ${
            isDarkMode 
              ? 'bg-slate-800 text-white hover:bg-slate-700 border border-slate-700' 
              : 'bg-black text-white hover:bg-slate-800'
          }`}
        >
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Back Home
        </button>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize Lucide icons on DOM updates
    setTimeout(() => lucide.createIcons(), 100);
  </script>
</body>
</html>
